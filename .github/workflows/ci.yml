name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: the same checks against fresh dependency / base-image releases (python:3.12-alpine, Playwright,
    # the Actions runner image).
    - cron: "37 14 * * 1"  # Mondays 14:37 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The watcher's evaluation, notifications, digest and state.json (pinned by golden files), the snapshot
  # writer, targets.json and the server, plus the privacy scanner's own tests, on every supported Python.
  # Nothing here may be skipped: any "skipped" in the output fails the job.
  tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v 2>&1 | tee unittest.log
      - name: Fail if any test was skipped
        shell: bash
        run: |
          if grep -Ei '\.\.\. skipped|skipped=' unittest.log; then
            echo "::error::a test was skipped; CI must run every test"
            exit 1
          fi

  # deals.html in a real browser, against deals_server.py with a generated 60-game deals.json and a targets.json.
  page-smoke:
    name: Page smoke test (Chromium via Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/browser/requirements.txt
      - run: pip install -r tests/browser/requirements.txt
      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/browser/requirements.txt') }}
      # On a cache hit the download is skipped; --with-deps still installs the system libraries.
      - run: playwright install --with-deps chromium
      - name: Run the page test
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v tests.browser.test_page 2>&1 | tee page.log
          if grep -Ei '\.\.\. skipped|skipped=' page.log; then echo "::error::a test was skipped"; exit 1; fi

  # install/alpine.sh twice (and a third time with one option changed) inside python:3.12-alpine, with apk, rc-*,
  # wget, curl, ip and su stubbed. Alpine is the primary target, so this runs on the real musl / BusyBox userland.
  installer:
    name: Alpine installer, run twice (python:3.12-alpine)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD:/src:ro" python:3.12-alpine sh /src/tests/installer/check.sh

  lint:
    name: Lint (shellcheck, py_compile, systemd-analyze)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: shellcheck --version
      - run: sh .github/scripts/lint.sh

  # No personal details in a public repo. Prints where and which rule, never the matched value.
  privacy-scan:
    name: Privacy scan (SteamIDs, IPs, emails, denylist)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Scan files and commits
        env:
          # Newline-separated terms (hostnames, domain, names, device names). Not available to pull requests from
          # forks or to Dependabot; the scan then runs its pattern checks only and says so.
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          HAVE_DENYLIST: ${{ secrets.PRIVACY_DENYLIST != '' }}
        run: |
          flag=""
          if [ "$HAVE_DENYLIST" = true ]; then
            flag="--require-denylist"
          else
            echo "::warning::PRIVACY_DENYLIST is not available to this run; only the pattern checks ran"
          fi
          python .github/scripts/privacy_scan.py $flag
